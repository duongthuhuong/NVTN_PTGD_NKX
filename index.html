<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chương trình Nhân viên Tài năng PVEP</title>

<style>

/* =========================================================
   01. HỆ MÀU
========================================================= */

:root{
    --pvep-green:#62c947;
    --pvep-green-light:#8ee171;
    --navy:#05283f;
    --navy-deep:#031a2b;
    --white:#ffffff;
}

/* =========================================================
   02. RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;

    background:var(--navy-deep);
    color:white;
}

a{
    font:inherit;
}

/* =========================================================
   03. APP
========================================================= */

.app{
    position:relative;

    width:100vw;
    height:100vh;
    min-height:640px;

    overflow:hidden;
    isolation:isolate;
}

/* =========================================================
   04. BACKGROUND
========================================================= */

.background{
    position:absolute;
    inset:0;

    z-index:-3;

    background-image:
        url("assets/images/cover-nvtn-final.png");

    background-repeat:no-repeat;
    background-size:cover;
    background-position:64% center;

    transform:scale(1.01);
}

.background::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(2,25,41,.88) 0%,
            rgba(2,28,45,.78) 18%,
            rgba(2,31,47,.58) 36%,
            rgba(2,31,47,.30) 53%,
            rgba(2,31,47,.10) 70%,
            rgba(2,31,47,.02) 100%
        );
}

.background::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.05),
            rgba(0,0,0,.10)
        );
}

/* =========================================================
   05. HEADER
========================================================= */

.header{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:40;

    height:138px;

    display:flex;
    align-items:center;

    padding:24px 5.3%;
}

.brand{
    display:flex;
    align-items:center;

    opacity:0;
    transform:translateY(-14px);

    animation:
        fadeDown
        .75s
        cubic-bezier(.2,.8,.2,1)
        .05s
        forwards;
}

/* =========================================================
   06. HERO
========================================================= */

.hero{
    position:absolute;

    left:5.3%;
    top:48%;

    transform:translateY(-50%);

    width:min(680px,44vw);

    z-index:25;
}

/* CHƯƠNG TRÌNH */

.program{
    margin-bottom:22px;

    color:var(--pvep-green);

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    font-style:normal;

    font-size:
        clamp(
            21px,
            1.7vw,
            28px
        );

    line-height:1.2;

    font-weight:800;
    letter-spacing:.5px;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;

    opacity:0;
    transform:translateX(-20px);

    animation:
        fadeLeft
        .65s
        ease
        .20s
        forwards;
}

/* NHÂN VIÊN TÀI NĂNG */

.hero-title{
    color:white;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    font-style:normal;

    font-size:
        clamp(
            56px,
            5.25vw,
            86px
        );

    line-height:.94;

    font-weight:800;
    letter-spacing:1.2px;

    text-transform:uppercase;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;

    text-shadow:
        0 3px 16px
        rgba(0,0,0,.25);

    opacity:0;
    transform:translateX(-24px);

    animation:
        fadeLeft
        .75s
        cubic-bezier(.2,.8,.2,1)
        .30s
        forwards;
}

.green-line{
    width:min(520px,100%);
    height:3px;

    margin:26px 0 19px;

    background:var(--pvep-green);

    transform-origin:left center;
    transform:scaleX(0);

    animation:
        lineGrow
        .76s
        ease
        .72s
        forwards;
}

.values{
    margin-bottom:17px;

    color:white;

    font-size:
        clamp(
            18px,
            1.48vw,
            25px
        );

    letter-spacing:.7px;
    white-space:nowrap;

    opacity:0;

    animation:
        fadeIn
        .65s
        ease
        .86s
        forwards;
}

.mentor{
    max-width:650px;

    margin-bottom:11px;

    color:white;

    font-size:
        clamp(
            16px,
            1.22vw,
            20px
        );

    line-height:1.5;
    font-weight:500;

    opacity:0;

    animation:
        fadeIn
        .65s
        ease
        1s
        forwards;
}

.years{
    color:white;

    font-size:20px;
    font-weight:800;

    letter-spacing:2px;

    opacity:0;

    animation:
        fadeIn
        .65s
        ease
        1.12s
        forwards;
}

/* =========================================================
   07. MENU CHÍNH
========================================================= */

.main-nav{
    position:absolute;

    left:5.3%;
    right:5.3%;
    bottom:25px;

    z-index:40;

    display:grid;
    grid-template-columns:repeat(5,1fr);

    gap:26px;

    opacity:0;

    animation:
        fadeIn
        .75s
        ease
        1.20s
        forwards;
}

.nav-btn{
    position:relative;

    min-height:48px;

    display:flex;
    align-items:baseline;

    gap:9px;

    padding:8px 2px 11px;

    background:transparent;

    color:white;

    text-align:left;
    text-decoration:none;

    cursor:pointer;

    transition:
        transform .25s ease,
        opacity .25s ease;
}

.nav-number{
    color:white;

    font-size:20px;
    font-weight:800;

    transition:
        color .25s ease,
        text-shadow .25s ease;
}

.nav-label{
    color:
        rgba(255,255,255,.93);

    font-size:14px;
    font-weight:600;

    letter-spacing:.4px;

    white-space:nowrap;

    transition:
        color .25s ease;
}

.nav-btn::after{
    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:0;
    height:2px;

    background:var(--pvep-green);

    box-shadow:
        0 0 12px
        rgba(98,201,71,.30);

    transition:
        width .30s ease;
}

.nav-btn:hover{
    transform:translateY(-4px);
}

.nav-btn:hover .nav-number{
    color:var(--pvep-green);
}

.nav-btn:hover .nav-label{
    color:white;
}

.nav-btn:hover::after{
    width:64px;
}

/* =========================================================
   08. ANIMATION
========================================================= */

@keyframes fadeDown{

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeLeft{

    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes fadeIn{

    to{
        opacity:1;
    }
}

@keyframes lineGrow{

    to{
        transform:scaleX(1);
    }
}

/* =========================================================
   09. TABLET
========================================================= */

@media(max-width:1100px){

    .hero{
        width:52vw;
    }

    .main-nav{
        gap:10px;
    }

    .nav-label{
        font-size:12px;
    }
}

/* =========================================================
   10. MOBILE
========================================================= */

@media(max-width:800px){

    body{
        overflow:hidden;
    }

    .app{
        min-height:100svh;
    }

    .background{
        background-position:68% center;
    }

    .header{
        height:104px;
        padding:17px 5%;
    }

    .hero{
        left:5%;
        top:39%;
        width:90%;
    }

    .program{
        margin-bottom:14px;
        font-size:19px;
        letter-spacing:.35px;
    }

    .hero-title{
        font-size:
            clamp(
                43px,
                12vw,
                58px
            );
    }

    .green-line{
        margin:18px 0 15px;
    }

    .values{
        white-space:normal;
        font-size:16px;
    }

    .mentor{
        max-width:90%;
        font-size:14px;
    }

    .years{
        font-size:18px;
    }

    .main-nav{
        left:4%;
        right:4%;
        bottom:58px;

        display:grid;
        grid-template-columns:repeat(5,1fr);

        gap:4px;
    }

    .nav-btn{
        min-height:50px;

        display:flex;
        flex-direction:column;

        justify-content:flex-start;
        align-items:center;

        gap:3px;

        padding:5px 1px;

        text-align:center;
    }

    .nav-number{
        font-size:15px;
        color:var(--pvep-green);
    }

    .nav-label{
        font-size:
            clamp(
                7px,
                2.1vw,
                10px
            );

        line-height:1.15;

        white-space:normal;
        text-align:center;
    }

    .nav-btn::after{
        left:50%;
        transform:translateX(-50%);
    }
}

/* =========================================================
   11. MOBILE NHỎ
========================================================= */

@media(max-width:420px){

    .hero{
        top:37%;
    }

    .program{
        font-size:17px;
    }

    .hero-title{
        font-size:43px;
    }

    .values{
        font-size:14px;
    }

    .mentor{
        font-size:13px;
    }

    .nav-number{
        font-size:14px;
    }

    .nav-label{
        font-size:7px;
    }
}

/* =========================================================
   12. REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}


/* =========================================================
   BỘ ĐẾM LƯỢT TRUY CẬP
========================================================= */
.visit-counter{
    position:absolute;
    right:28px;
    bottom:24px;
    z-index:60;
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 12px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:999px;
    background:rgba(3,26,43,.20);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:rgba(255,255,255,.48);
    font-size:12px;
    font-weight:600;
    letter-spacing:.2px;
}
.visit-counter strong{
    color:rgba(255,255,255,.62);
    font-variant-numeric:tabular-nums;
}
.visit-eye{
    color:rgba(98,201,71,.58);
    font-size:13px;
}
@media(max-width:800px){
    .visit-counter{
        right:14px;
        bottom:10px;
        padding:5px 9px;
        font-size:10px;
        white-space:nowrap;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- BỘ ĐẾM LƯỢT TRUY CẬP -->
    <div class="visit-counter" id="visitCounter" title="Tổng lượt truy cập trang Nhân viên Tài năng">
        <span class="visit-eye">◉</span>
        <strong id="visitCount">—</strong>
        <span>lượt truy cập</span>
    </div>


    <!-- ẢNH NỀN -->

    <div class="background"></div>

    <!-- HEADER -->

    <header class="header">

        <div class="brand">
        </div>

    </header>

    <!-- NỘI DUNG COVER -->

    <main class="hero">

        <div class="program">
            CHƯƠNG TRÌNH
        </div>

        <div class="hero-title">
            NHÂN VIÊN<br>
            TÀI NĂNG
        </div>

        <div class="green-line"></div>

        <div class="values">
            HỌC HỎI
            &nbsp;•&nbsp;
            KẾT NỐI
            &nbsp;•&nbsp;
            PHÁT TRIỂN
        </div>

        <div class="mentor">
            Phó Tổng giám đốc Ngô Khánh Xạ
            hướng dẫn và đồng hành
        </div>

        <div class="years">
            2025 — 2026
        </div>

    </main>

    <!-- =====================================================
         MENU CHUẨN

         01 = 01-gioi-thieu
         02 = 02-hanh-trinh
         03 = 03-cac-buoi-hoc
         04 = 04-dieu-dong-lai
         05 = 05-thu-vien
    ====================================================== -->

    <nav
        class="main-nav"
        aria-label="Menu chính"
    >

        <!-- 01 GIỚI THIỆU -->

        <a
            class="nav-btn"
            href="01-gioi-thieu/"
        >

            <span class="nav-number">
                01
            </span>

            <span class="nav-label">
                GIỚI THIỆU
            </span>

        </a>

        <!-- 02 HÀNH TRÌNH -->

        <a
            class="nav-btn"
            href="02-hanh-trinh/"
        >

            <span class="nav-number">
                02
            </span>

            <span class="nav-label">
                HÀNH TRÌNH
            </span>

        </a>

        <!-- 03 CÁC BUỔI HỌC -->

        <a
            class="nav-btn"
            href="03-cac-buoi-hoc/"
        >

            <span class="nav-number">
                03
            </span>

            <span class="nav-label">
                CÁC BUỔI HỌC
            </span>

        </a>

        <!-- 04 ĐIỀU ĐỌNG LẠI -->

        <a
            class="nav-btn"
            href="04-dieu-dong-lai/"
        >

            <span class="nav-number">
                04
            </span>

            <span class="nav-label">
                ĐIỀU ĐỌNG LẠI
            </span>

        </a>

        <!-- 05 THƯ VIỆN -->

        <a
            class="nav-btn"
            href="05-thu-vien/"
        >

            <span class="nav-number">
                05
            </span>

            <span class="nav-label">
                THƯ VIỆN
            </span>

        </a>

    </nav>

</div>


<script>
window.addEventListener("load", () => {
    const startCounter = () => {
        const sdk = document.createElement("script");
        sdk.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        sdk.async = true;

        sdk.onload = async () => {
            const countEl = document.getElementById("visitCount");
            if(!countEl || !window.supabase) return;

            try{
                const client = window.supabase.createClient(
                    "https://rfrhiexkxztulwauevtf.supabase.co",
                    "sb_publishable_6I8RxZdVpu2Aj3q5qKsAwA_xv3SojaH"
                );

                const { error: insertError } = await client
                    .from("site_visits")
                    .insert({ page: "nvtn" });
                if(insertError) throw insertError;

                const { count, error: countError } = await client
                    .from("site_visits")
                    .select("*", { count: "exact", head: true })
                    .eq("page", "nvtn");
                if(countError) throw countError;

                countEl.textContent =
                    Number(count || 0).toLocaleString("vi-VN");
            }catch(err){
                console.warn("Visit counter chưa sẵn sàng:", err?.message || err);
                countEl.textContent = "—";
            }
        };

        document.head.appendChild(sdk);
    };

    if("requestIdleCallback" in window){
        requestIdleCallback(startCounter, { timeout: 1500 });
    }else{
        setTimeout(startCounter, 500);
    }
});
</script>

</body>
</html>
